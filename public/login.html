<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Email Agent — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07080f; --surface: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.08);
      --border-focus: rgba(99,102,241,0.6); --text: #f1f5f9; --muted: #64748b;
      --accent: #6366f1; --accent2: #8b5cf6; --glow: rgba(99,102,241,0.25);
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .ambient-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.35; }
    .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, #6366f1 0%, transparent 70%); top: -150px; left: -100px; animation: drift1 12s ease-in-out infinite alternate; }
    .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, #8b5cf6 0%, transparent 70%); bottom: -100px; right: -80px; animation: drift2 15s ease-in-out infinite alternate; }
    .orb-3 { width: 300px; height: 300px; background: radial-gradient(circle, #06b6d4 0%, transparent 70%); top: 50%; left: 60%; animation: drift3 10s ease-in-out infinite alternate; opacity: 0.2; }
    @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(40px,60px); } }
    @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-40px,-50px); } }
    @keyframes drift3 { from { transform: translate(0,0); } to { transform: translate(-60px,40px); } }
    .login-card { position: relative; z-index: 1; width: 100%; max-width: 400px; margin: 20px; background: rgba(255,255,255,0.05); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: 20px; padding: 40px 36px; box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 32px 64px rgba(0,0,0,0.5), 0 0 80px var(--glow); animation: slideUp 0.5s cubic-bezier(0.22,1,0.36,1) both; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .logo { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; }
    .logo-icon { width: 48px; height: 48px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 8px 24px rgba(99,102,241,0.4); }
    .logo-text h1 { font-size: 18px; font-weight: 700; color: var(--text); line-height: 1.2; }
    .logo-text p { font-size: 12px; color: var(--muted); font-weight: 400; }
    .heading { margin-bottom: 8px; font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #f1f5f9 0%, #94a3b8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subheading { font-size: 13px; color: var(--muted); margin-bottom: 28px; line-height: 1.5; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
    .input-wrap { position: relative; }
    .input-wrap svg.lock-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    input[type="password"] { width: 100%; padding: 12px 44px 12px 44px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: inherit; font-size: 15px; outline: none; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; }
    input[type="text"].pw-visible { width: 100%; padding: 12px 44px 12px 44px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: inherit; font-size: 15px; outline: none; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; }
    input:focus { border-color: var(--border-focus) !important; background: rgba(99,102,241,0.06) !important; box-shadow: 0 0 0 3px rgba(99,102,241,0.15) !important; }
    .eye-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; display: flex; align-items: center; border-radius: 6px; transition: color 0.2s; }
    .eye-btn:hover { color: var(--text); }
    .btn-login { width: 100%; padding: 13px; margin-top: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 10px; color: white; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s; box-shadow: 0 4px 20px rgba(99,102,241,0.4); display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-login:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 8px 28px rgba(99,102,241,0.5); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .alert { padding: 12px 14px; border-radius: 10px; font-size: 13px; font-weight: 500; margin-top: 14px; display: none; align-items: center; gap: 8px; }
    .alert.error { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25); color: #fca5a5; }
    .alert.success { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.25); color: #6ee7b7; }
    .alert.show { display: flex; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .footer { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="login-card" id="card">
    <div class="logo">
      <div class="logo-icon">📧</div>
      <div class="logo-text">
        <h1>Smart Email Agent</h1>
        <p>AI-Powered Email Intelligence</p>
      </div>
    </div>
    <h2 class="heading">Welcome back</h2>
    <p class="subheading">Enter your dashboard password to continue.</p>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="pwInput">Dashboard Password</label>
        <div class="input-wrap">
          <svg class="lock-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="pwInput" placeholder="Enter password..." autocomplete="current-password" autofocus>
          <button type="button" class="eye-btn" onclick="toggleEye()">
            <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeClosed" style="display:none" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">
        <div class="spinner" id="spinner"></div>
        <span id="btnText">Sign In to Dashboard</span>
      </button>
      <div class="alert error" id="errorAlert"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg><span id="errorMsg">Incorrect password.</span></div>
      <div class="alert success" id="successAlert"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><span>Access granted! Redirecting...</span></div>
    </form>
    <div class="footer">Session expires after 8 hours &nbsp;·&nbsp; Your data stays private</div>
  </div>
  <script>
    fetch('/api/auth/status').then(r=>r.json()).then(d=>{ if(d.authenticated) window.location.replace('/'); }).catch(()=>{});
    function toggleEye(){
      const i=document.getElementById('pwInput'),o=document.getElementById('eyeOpen'),c=document.getElementById('eyeClosed');
      if(i.type==='password'){i.type='text';o.style.display='none';c.style.display='';}
      else{i.type='password';o.style.display='';c.style.display='none';}
    }
    async function handleLogin(e){
      e.preventDefault();
      const pw=document.getElementById('pwInput').value;
      const btn=document.getElementById('loginBtn'),sp=document.getElementById('spinner'),bt=document.getElementById('btnText');
      const ea=document.getElementById('errorAlert'),sa=document.getElementById('successAlert');
      ea.classList.remove('show'); sa.classList.remove('show');
      btn.disabled=true; sp.style.display=''; bt.textContent='Signing in...';
      try {
        const res=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
        const data=await res.json();
        if(res.ok&&data.success){ sa.classList.add('show'); setTimeout(()=>window.location.replace('/'),800); }
        else { throw new Error(data.error||'Incorrect password.'); }
      } catch(err){
        document.getElementById('errorMsg').textContent=err.message;
        ea.classList.add('show');
        btn.disabled=false; sp.style.display='none'; bt.textContent='Sign In to Dashboard';
        document.getElementById('card').animate(
          [{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'none'}],
          {duration:350,easing:'ease-out'}
        );
      }
    }
  </script>
</body>
</html>
